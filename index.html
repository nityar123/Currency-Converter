<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter with Chart</title>
  <link rel="stylesheet" href="converterStyle.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Heading Bar -->
  <header class="app-header">
    <h1>💸 Currency Converter Pro</h1>
    <p>Live rates, historical trends, global coverage</p>
  </header>

  <!-- Main Converter Box -->
  <div class="converter-container">
    <label for="amount">Amount:</label>
    <input type="number" id="amount" placeholder="Enter amount" />

    <label for="fromCurrency">From:</label>
    <div class="flag-row">
      <img id="fromFlag" src="" alt="From flag" />
      <select id="fromCurrency"></select>
    </div>

    <label for="toCurrency">To:</label>
    <div class="flag-row">
      <img id="toFlag" src="" alt="To flag" />
      <select id="toCurrency"></select>
    </div>

    <button id="convertBtn">Convert</button>
    <h2 id="result"></h2>

    <canvas id="rateChart"></canvas>
    <p id="percentChange"></p>
  </div>

  <script src="converterScript.js"></script>
</body>
</html>
